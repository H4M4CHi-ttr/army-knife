name: Offline multilingual search comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/search-compare/**"
      - "src/lib/search/compare-benchmark.test.ts"
      - ".github/workflows/search-compare.yml"

permissions:
  contents: read

jobs:
  compare:
    name: Held-out multilingual benchmark
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'feat/multilingual-natural-search' || github.head_ref == 'experiment/multilingual-search-bench')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      SEARCH_COMPARE_OUTPUT: scripts/search-compare/.out
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      TOKENIZERS_PARALLELISM: "false"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.1.0"
          node-version: "24.19.0"
          run-install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen JavaScript dependencies
        run: vp install --frozen-lockfile

      - name: Export predictions from actual production searchTools implementation
        run: vp test src/lib/search/compare-benchmark.test.ts

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.12"

      - name: Install benchmark-only Python dependencies
        run: python -m pip install --disable-pip-version-check "model2vec==0.10.0" "scikit-learn==1.7.2" "psutil==7.1.0"

      - name: Train dedicated classifier and run pinned multilingual Model2Vec inference
        run: python scripts/search-compare/run.py

      - name: Archive reproducible rankings, errors, summary and classifier data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multilingual-search-comparison
          path: scripts/search-compare/.out
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
