[package]
name = "army-knife-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Local-only CSV, log, and text-set analysis for Army Knife"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csv = "=1.4.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
